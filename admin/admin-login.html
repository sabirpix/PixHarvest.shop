<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin Login - PixHarvest</title>
<link rel="stylesheet" href="css/admin-style.css"></head>
<body>
  <div class="auth-card">
    <h2>PixHarvest — Admin Login</h2>
    <form id="loginForm">
      <input id="email" type="email" placeholder="Admin email" required>
      <input id="password" type="password" placeholder="Password" required>
      <button type="submit">Login</button>
    </form>
    <p class="small" style="text-align:center;margin-top:8px">Don't have an admin account? <a href="admin-signup.html">Sign up</a></p>
    <p id="msg" class="small" style="text-align:center;color:red"></p>
  </div>

<script type="module">
import { initializeApp } from 'https://www.gstatic.com/firebasejs/9.22.1/firebase-app.js';
import { getAuth, signInWithEmailAndPassword, onAuthStateChanged } from 'https://www.gstatic.com/firebasejs/9.22.1/firebase-auth.js';
import { getFirestore, doc, getDoc } from 'https://www.gstatic.com/firebasejs/9.22.1/firebase-firestore.js';

const firebaseConfig = {"apiKey": "AIzaSyA5TPkfexV0OAu_YLlY5zVgDTRcuJcPODE", "authDomain": "pixharvest-8f0b3.firebaseapp.com", "databaseURL": "https://pixharvest-8f0b3-default-rtdb.firebaseio.com", "projectId": "pixharvest-8f0b3", "storageBucket": "pixharvest-8f0b3.appspot.com", "messagingSenderId": "725723341167", "appId": "1:725723341167:web:aae812619849d4941a089a", "measurementId": "G-E2SQ98YEFB"};
const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

const msg = document.getElementById('msg');
document.getElementById('loginForm').addEventListener('submit', async (e)=>{ e.preventDefault(); msg.textContent=''; const email = document.getElementById('email').value; const password = document.getElementById('password').value;
  try{ const cred = await signInWithEmailAndPassword(auth, email, password); const uid = cred.user.uid;
    // check admin record exists
    const adminDoc = await getDoc(doc(db,'admins', uid));
    if(!adminDoc.exists()){ msg.textContent = 'Not an admin account.'; await auth.signOut(); return; }
    // redirect
    location.href = 'admin-dashboard.html';
  }catch(err){ msg.textContent = err.message; }
});

// if already logged in and admin, redirect
onAuthStateChanged(auth, async (user)=>{
  if(user){
    const ad = await getDoc(doc(db,'admins', user.uid));
    if(ad.exists()){ location.href = 'admin-dashboard.html'; }
  }
});
</script>
</body>
</html>
