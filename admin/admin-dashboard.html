<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin Dashboard - PixHarvest</title>
<link rel="stylesheet" href="css/admin-style.css"></head>
<body>
  <div class="nav">
    <div class="container" style="display:flex;align-items:center;justify-content:space-between">
      <div><strong>PixHarvest Admin</strong></div>
      <div class="menu">
        <a class="btn" href="products.html">Products</a>
        <a class="btn" href="orders.html">Orders</a>
        <a class="btn" href="customers.html">Customers</a>
        <a class="btn" id="logoutBtn" href="#">Logout</a>
      </div>
    </div>
  </div>

  <main class="container" style="margin-top:20px">
    <h1>Welcome, <span id="adminName">Admin</span></h1>
    <p class="small">Use the menu above to manage products, orders and customers.</p>
    <div style="margin-top:16px;display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px">
      <div class="card"><h3>Products</h3><p id="prodCount">--</p></div>
      <div class="card"><h3>Orders</h3><p id="orderCount">--</p></div>
      <div class="card"><h3>Customers</h3><p id="custCount">--</p></div>
    </div>
  </main>

<script type="module">
import { initializeApp } from 'https://www.gstatic.com/firebasejs/9.22.1/firebase-app.js';
import { getAuth, signOut, onAuthStateChanged } from 'https://www.gstatic.com/firebasejs/9.22.1/firebase-auth.js';
import { getFirestore, doc, getDoc, collection, getCountFromServer } from 'https://www.gstatic.com/firebasejs/9.22.1/firebase-firestore.js';

const firebaseConfig = {"apiKey": "AIzaSyA5TPkfexV0OAu_YLlY5zVgDTRcuJcPODE", "authDomain": "pixharvest-8f0b3.firebaseapp.com", "databaseURL": "https://pixharvest-8f0b3-default-rtdb.firebaseio.com", "projectId": "pixharvest-8f0b3", "storageBucket": "pixharvest-8f0b3.appspot.com", "messagingSenderId": "725723341167", "appId": "1:725723341167:web:aae812619849d4941a089a", "measurementId": "G-E2SQ98YEFB"};
const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

const adminNameEl = document.getElementById('adminName');
const logoutBtn = document.getElementById('logoutBtn');

onAuthStateChanged(auth, async (user)=>{
  if(!user){ location.href='admin-login.html'; return; }
  // verify admin record exists
  const ad = await getDoc(doc(db,'admins', user.uid));
  if(!ad.exists()){ await signOut(auth); location.href='admin-login.html'; return; }
  const data = ad.data();
  adminNameEl.textContent = data.name || data.email;

  // fetch counts (best-effort)
  try{
    const p = await getCountFromServer(collection(db,'products'));
    const o = await getCountFromServer(collection(db,'orders'));
    const u = await getCountFromServer(collection(db,'users'));
    document.getElementById('prodCount').textContent = p.data().count;
    document.getElementById('orderCount').textContent = o.data().count;
    document.getElementById('custCount').textContent = u.data().count;
  }catch(e){ console.warn('count fetch failed', e) }
});

logoutBtn.addEventListener('click', async (e)=>{ e.preventDefault(); await signOut(auth); location.href='admin-login.html'; });
</script>
</body>
</html>
