<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin - Orders</title><link rel="stylesheet" href="../css/style.css"></head><body>
<main class="container"><h1>Orders</h1><div id="orders-list"></div></main>
<div id="editModal" class="modal"><div class="box"><h3>Edit Order</h3><form id="editForm"><p>Order ID: <span id="modalOrderId" class="small"></span></p><p><label>Delivery Status<select id="deliveryStatus"><option>Pending</option><option>Packed</option><option>Out for Delivery</option><option>Delivered</option></select></label></p><p><label>Estimated Delivery<input id="estimatedDelivery" placeholder="e.g. 2 days"></label></p><p><label>Reduce Stock After Delivery? <select id="reduceStock"><option value="no">No</option><option value="yes">Yes</option></select></label></p><p style="display:flex;gap:8px"><button id="saveEdit" class="btn" type="button">Save</button><button id="cancelEdit" class="btn" type="button">Cancel</button></p></form></div></div>
<script type="module">
import { firebaseConfig } from '../js/firebase-config.js';
import { initializeApp } from 'https://www.gstatic.com/firebasejs/9.22.1/firebase-app.js';
import { getFirestore, collection, getDocs, doc, updateDoc, getDoc } from 'https://www.gstatic.com/firebasejs/9.22.1/firebase-firestore.js';
const app = initializeApp(firebaseConfig); const db = getFirestore(app);
const ordersList = document.getElementById('orders-list'); const editModal = document.getElementById('editModal'); const modalOrderId = document.getElementById('modalOrderId'); const deliveryStatus = document.getElementById('deliveryStatus'); const estimatedDelivery = document.getElementById('estimatedDelivery'); const reduceStock = document.getElementById('reduceStock'); const saveEdit = document.getElementById('saveEdit'); const cancelEdit = document.getElementById('cancelEdit');
let currentOrder = null;
async function loadOrders(){ const snap = await getDocs(collection(db,'orders')); let html = '<table class="table"><tr><th>Order ID</th><th>Name</th><th>Items</th><th>Total</th><th>Delivery</th><th>Status</th><th>Action</th></tr>'; snap.forEach(d=>{ const o = d.data(); html += `<tr><td>${d.id}</td><td>${o.customerName}</td><td>${o.items ? o.items.length : 0}</td><td>₹${o.totalAmount}</td><td>${o.estimatedDelivery || ''}</td><td>${o.deliveryStatus || o.paymentStatus}</td><td><button data-id="${d.id}" class="editBtn">Edit</button></td></tr>` }); html += '</table>'; ordersList.innerHTML = html; Array.from(document.getElementsByClassName('editBtn')).forEach(bt=>bt.addEventListener('click', (e)=>{ openEdit(e.target.dataset.id); })); }
async function openEdit(orderId){ currentOrder = orderId; modalOrderId.textContent = orderId; const oDoc = await getDoc(doc(db,'orders', orderId)); if(oDoc.exists()){ const o = oDoc.data(); deliveryStatus.value = o.deliveryStatus || 'Pending'; estimatedDelivery.value = o.estimatedDelivery || ''; } editModal.style.display = 'flex'; }
cancelEdit.addEventListener('click', ()=>{ editModal.style.display = 'none'; });
saveEdit.addEventListener('click', async ()=>{ if(!currentOrder) return; const status = deliveryStatus.value; const est = estimatedDelivery.value; const reduce = reduceStock.value === 'yes'; try{ await updateDoc(doc(db,'orders', currentOrder), { deliveryStatus: status, estimatedDelivery: est }); if(reduce){ const oDoc = await getDoc(doc(db,'orders', currentOrder)); if(oDoc.exists()){ const o = oDoc.data(); if(o.items && Array.isArray(o.items)){ for(const it of o.items){ try{ const pRef = doc(db,'products', it.productId); const pSnap = await getDoc(pRef); if(pSnap.exists()){ const p = pSnap.data(); const newStock = Math.max(0, (p.stock||0) - (it.quantity||0)); await updateDoc(pRef, { stock: newStock }); } }catch(e){ console.error('stock update failed', e) } } } } } alert('Order updated'); editModal.style.display = 'none'; loadOrders(); }catch(err){ console.error(err); alert('Failed: '+err.message) } }); loadOrders();
</script></body></html>
