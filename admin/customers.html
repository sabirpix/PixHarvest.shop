<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin - Customers</title><link rel="stylesheet" href="../css/style.css"></head><body><main class="container"><h1>Customers (Users)</h1><div id="list"></div></main><script type="module">import { firebaseConfig } from '../js/firebase-config.js';import { initializeApp } from 'https://www.gstatic.com/firebasejs/9.22.1/firebase-app.js';import { getFirestore, collection, getDocs } from 'https://www.gstatic.com/firebasejs/9.22.1/firebase-firestore.js';const app = initializeApp(firebaseConfig); const db = getFirestore(app); const list = document.getElementById('list'); (async ()=>{ const snap = await getDocs(collection(db,'users')); let html = '<table class="table"><tr><th>Name</th><th>Email</th></tr>'; snap.forEach(d=>{ const u = d.data(); html += `<tr><td>${u.name||''}</td><td>${u.email||''}</td></tr>` }); html += '</table>'; list.innerHTML = html; })();</script></body></html>
